name: CI
on: [push, pull_request]
jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npm run version:check
      - run: npm test
      # Dogfood: audit our own fixtures. (Use a real source path in your repo.)
      # - run: node src/cli.js ./src --ci
